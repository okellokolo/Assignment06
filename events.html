<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Assignment</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <section class="employee-management">
      <div class="container-lg">
        <div class="text-center">
          <h2>Employee Management System</h2>
        </div>
        <div class="row justify-content-center my-5">
          <div class="col-lg-6">
            <form id="form">
              <label for="employeeID" name="text">8-Digit Employee ID</label>
              <input
                type="text"
                id="employeeID"
                class="form-control"
                maxlength="8"
                required
              />
              <label for="fullName" name="text" class="text">Full Name</label>
              <input type="text" id="fullName" class="form-control" required />
              <label for="ext" class="text">4-Digit Extention</label>
              <input
                type="text"
                id="ext"
                class="form-control"
                maxlength="4"
                required
              />
              <label for="email" class="text">E-mail</label>
              <input type="text" id="email" class="form-control" required />
              <label for="select" class="text">Department</label>
              <select id="select" name="department" class="form-select">
                <option selected="Administrative">Administrative</option>
                <option value="Engineering">Engineering</option>
                <option value="Executive">Executive</option>
                <option value="Marketing">Marketing</option>
                <option value="Quality Assurance">Quality Assurance</option>
                <option value="Sales">Sales</option>
              </select>
              <input type="submit" class="submit" />
            </form>
          </div>
        </div>
      </div>
    </section>
    <script src="bootstrap5.js"></script>
  </body>
</html>
